name: CI

on:
  push:
  pull_request:

# Least privilege for the workflow token: CI only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: naseeb
          POSTGRES_PASSWORD: naseeb-ci
          POSTGRES_DB: naseeb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U naseeb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Audit Python dependencies for known vulnerabilities
        run: pip install pip-audit==2.10.1 && pip-audit -r backend/requirements.txt
      - run: python backend/manage.py makemigrations --check --dry-run
        env:
          APP_ENV: test
          SECRET_KEY: ci-only-secret
      - name: Django tests (SQLite)
        run: python backend/manage.py test -v 2
        env:
          SECRET_KEY: ci-only-secret
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,testserver
      - name: Django tests (PostgreSQL, matches production)
        run: python backend/manage.py test -v 2 --noinput
        env:
          SECRET_KEY: ci-only-secret
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,testserver
          DATABASE_URL: postgres://naseeb:naseeb-ci@localhost:5432/naseeb
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Frontend lint (ESLint + react-hooks, Stylelint)
        run: npm run lint
        working-directory: frontend
      - name: Frontend unit tests (incl. image budget, nginx CSP)
        run: npm test
        working-directory: frontend
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node scripts/frontend_smoke.js
      - run: node scripts/assessment_i18n_smoke.mjs
      - run: node scripts/portal_i18n_smoke.mjs
