    <meta property="og:url" content="https://naseebedu.com/" />

    <meta property="og:locale:alternate" content="ru_RU" />
    <meta property="og:locale:alternate" content="en_GB" />

    <meta name="twitter:title" content="Naseeb Edu - Global ta’lim uchun aniq yo‘l" />
    <meta name="twitter:description" content="Roadmap, universitet qidiruvi, esse, hujjatlar va counselor hamkorligi bitta ishonchli platformada." />
    <meta name="twitter:image" content="https://naseebedu.com/landing/naseeb-student-application-hero.jpg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/montserrat-latin.woff2" crossorigin />
    <link rel="preload" as="image" type="image/webp" data-theme-hero fetchpriority="high" imagesizes="(max-width: 820px) 100vw, 760px" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-light-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <title>Naseeb Edu - Ta’lim bo‘yicha maslahat platformasi</title>
    <style>
      html { background: #f6f7fb; color-scheme: light; }
      body { margin: 0; min-width: 320px; min-height: 100dvh; background: inherit; }
      .app-boot { min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; color: #17243B; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .app-boot-card { width: min(360px, 100%); display: grid; justify-items: center; gap: 18px; text-align: center; }
      .app-boot-mark { width: 96px; height: 96px; position: relative; display: grid; place-items: center; border: 1px solid rgba(23,36,59,.22); border-radius: 50%; }
      .app-boot-mark i { width: 52px; height: 52px; display: block; background: #0057FF; -webkit-mask: url('/brand/assistant-bird.png') center / contain no-repeat; mask: url('/brand/assistant-bird.png') center / contain no-repeat; animation: boot-pulse 1.6s ease-in-out infinite; }
      .app-boot-mark::before, .app-boot-mark::after { content: ''; position: absolute; inset: -1px; border: 2px solid transparent; border-top-color: #0057FF; border-radius: 50%; animation: boot-spin 1.05s linear infinite; }
      .app-boot-mark::after { inset: 9px; border-top-color: transparent; border-bottom-color: #8FB2FF; animation-direction: reverse; animation-duration: 1.4s; }
      .app-boot-copy b, .app-boot-copy span { display: block; }
      .app-boot-copy b { font: 600 20px/1.2 Georgia, serif; letter-spacing: .035em; }
      .app-boot-copy span { margin-top: 7px; color: #5B6780; font-size: 12px; }
      .app-boot-line { width: 190px; height: 4px; overflow: hidden; background: rgba(23,36,59,.13); border-radius: 99px; }
      .app-boot-line::after { content: ''; width: 42%; height: 100%; display: block; background: #0057FF; border-radius: inherit; animation: boot-slide 1.25s ease-in-out infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-pulse { 0%, 100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1); } }
      @keyframes boot-slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(340%); } }
      @media (prefers-reduced-motion: reduce) { .app-boot-mark::before, .app-boot-mark::after, .app-boot-mark i, .app-boot-line::after { animation-duration: .01ms; animation-iteration-count: 1; } }
    </style>
    <script>
      (() => {
        try {
          const supportedLanguages = ['uz', 'ru', 'en']
          const urlLanguage = new URLSearchParams(location.search).get('lang')
          const storedLanguage = localStorage.getItem('naseeb-edu-language-v1')
          const browserLanguage = navigator.language?.split('-')[0]
          document.documentElement.lang = [urlLanguage, storedLanguage, browserLanguage].find((value) => supportedLanguages.includes(value)) || 'en'
          document.documentElement.dataset.theme = 'light'
          document.documentElement.style.colorScheme = 'light'
          document.getElementById('theme-color').content = '#f6f7fb'
        } catch {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.style.colorScheme = 'light'
        }
        // The hero is only preloaded for visitors who will see the landing
        // page: not for a signed-in browser (the workspace opens) or #/login.
        // The session key (src/sessionKeys.js, filled in at build time) holds no
        // secret; tokens are never in storage.
        let signedIn = false
        try {
          signedIn = localStorage.getItem('__SESSION_HINT_KEY__') !== null
        } catch { /* storage disabled: treat as a visitor */ }
        const hero = document.querySelector('link[data-theme-hero]')
        if (hero && (signedIn || location.hash === '#/login')) hero.remove()
        else if (hero) {
          // Match the rendered hero, including the storage-disabled fallback.
          const variant = 'light'
          hero.setAttribute('imagesrcset', [640, 960, 1448].map((w) => '/landing/hero-' + variant + '-' + w + '.webp ' + w + 'w').join(', '))
          hero.href = '/landing/hero-' + variant + '-1448.webp'
        }
        // The Latin subset is preloaded statically; Russian also needs Cyrillic.
        if (document.documentElement.lang === 'ru') {
          const font = document.createElement('link')
          font.rel = 'preload'
          font.as = 'font'
          font.type = 'font/woff2'
          font.href = '/fonts/montserrat-cyrillic.woff2'
          font.crossOrigin = ''
          document.head.appendChild(font)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"><div class="app-boot" role="status" aria-label="Naseeb Edu"><div class="app-boot-card"><div class="app-boot-mark" aria-hidden="true"><i></i></div><div class="app-boot-copy"><b>Naseeb Edu</b><span data-boot-message>Preparing your workspace…</span></div><div class="app-boot-line" aria-hidden="true"></div></div></div></div>
    <script>
      (() => {
        const copy = {
          uz: 'Ish maydoningiz tayyorlanmoqda…',
          ru: 'Готовим ваше рабочее пространство…',
          en: 'Preparing your workspace…',
        }
        const node = document.querySelector('[data-boot-message]')
        if (node) node.textContent = copy[document.documentElement.lang] || copy.en
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
