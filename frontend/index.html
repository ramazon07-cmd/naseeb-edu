<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F0E6" />
    <meta name="description" content="Naseeb Edu education counseling platform" />
    <link rel="icon" data-theme-icon href="/brand/naseeb-light.jpg" />
    <title>Naseeb Edu — Education Counseling Platform</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('naseeb-edu-theme')
          const theme = saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.style.colorScheme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
