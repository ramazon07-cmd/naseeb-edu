<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta id="theme-color" name="theme-color" content="#F5F0E6" />
    <meta name="description" content="Naseeb Edu education counseling platform" />
    <link rel="preload" as="image" href="/brand/naseeb-light-256.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="/brand/naseeb-dark-256.png" fetchpriority="high" />
    <link rel="icon" data-theme-icon href="/brand/naseeb-light-256.jpg" />
    <title>Naseeb Edu — Education Counseling Platform</title>
    <style>
      html { background: #F5F0E6; color-scheme: light; }
      html[data-theme='dark'] { background: #121015; color-scheme: dark; }
      body { margin: 0; min-width: 320px; min-height: 100dvh; background: inherit; }
      .app-boot { min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; color: #4A4036; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      html[data-theme='dark'] .app-boot { color: #F2F2F5; }
      .app-boot-card { width: min(360px, 100%); display: grid; justify-items: center; gap: 18px; text-align: center; }
      .app-boot-mark { width: 76px; height: 76px; position: relative; display: grid; place-items: center; border: 1px solid rgba(74,64,54,.22); border-radius: 50%; font: 600 27px/1 Georgia, serif; }
      html[data-theme='dark'] .app-boot-mark { border-color: rgba(215,168,238,.34); }
      .app-boot-mark::before, .app-boot-mark::after { content: ''; position: absolute; inset: -1px; border: 2px solid transparent; border-top-color: #765E42; border-radius: 50%; animation: boot-spin 1.05s linear infinite; }
      .app-boot-mark::after { inset: 7px; border-top-color: transparent; border-bottom-color: #B8A58A; animation-direction: reverse; animation-duration: 1.4s; }
      html[data-theme='dark'] .app-boot-mark::before { border-top-color: #D7A8EE; }
      html[data-theme='dark'] .app-boot-mark::after { border-bottom-color: #8F59AB; }
      .app-boot-copy b, .app-boot-copy span { display: block; }
      .app-boot-copy b { font: 600 20px/1.2 Georgia, serif; letter-spacing: .035em; }
      .app-boot-copy span { margin-top: 7px; color: #766A5D; font-size: 12px; }
      html[data-theme='dark'] .app-boot-copy span { color: #B6AFBB; }
      .app-boot-line { width: 190px; height: 4px; overflow: hidden; background: rgba(74,64,54,.13); border-radius: 99px; }
      html[data-theme='dark'] .app-boot-line { background: rgba(232,225,236,.13); }
      .app-boot-line::after { content: ''; width: 42%; height: 100%; display: block; background: #765E42; border-radius: inherit; animation: boot-slide 1.25s ease-in-out infinite; }
      html[data-theme='dark'] .app-boot-line::after { background: #C69BDD; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(340%); } }
      @media (prefers-reduced-motion: reduce) { .app-boot-mark::before, .app-boot-mark::after, .app-boot-line::after { animation-duration: .01ms; animation-iteration-count: 1; } }
    </style>
    <script>
      (() => {
        try {
          const supportedLanguages = ['uz', 'ru', 'en']
          const storedLanguage = localStorage.getItem('naseeb-edu-language-v1')
          const browserLanguage = navigator.language?.split('-')[0]
          document.documentElement.lang = supportedLanguages.includes(storedLanguage)
            ? storedLanguage
            : supportedLanguages.includes(browserLanguage) ? browserLanguage : 'en'
          const saved = localStorage.getItem('naseeb-edu-theme')
          const theme = saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          document.getElementById('theme-color').content = theme === 'dark' ? '#121015' : '#F5F0E6'
          document.querySelector('link[data-theme-icon]').href = theme === 'dark'
            ? '/brand/naseeb-dark-256.png'
            : '/brand/naseeb-light-256.jpg'
        } catch {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.style.colorScheme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"><div class="app-boot" role="status" aria-label="Loading Naseeb Edu"><div class="app-boot-card"><div class="app-boot-mark" aria-hidden="true">N</div><div class="app-boot-copy"><b>Naseeb Edu</b><span>Preparing your workspace…</span></div><div class="app-boot-line" aria-hidden="true"></div></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
