# Docker Compose only (mounted as /etc/nginx/snippets/api-proxy.conf): serve the
# API from the app's own origin so the SameSite=Strict refresh cookie is
# first-party whichever host name the browser uses (localhost or 127.0.0.1).
# The production image has no such file; its nginx.conf include matches nothing.
location ^~ /api/ {
    proxy_pass http://backend:8000;
    # Keep the browser's host:port, so Django sees the request's Origin as its own.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 27m;
    proxy_read_timeout 120s;
}
