# Template: scripts/render-nginx-conf.mjs fills the CSP placeholder at image build time
# (inline-script hashes from the built index.html + the API origin).
#
# naseebedu.com is the canonical production domain (non-www). Requests for
# the www host are permanently redirected here, path and query preserved.
server {
    listen 80;
    server_name www.naseebedu.com;
    return 301 https://naseebedu.com$request_uri;
}

server {
    listen 80 default_server;
    server_name naseebedu.com _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml font/ttf application/manifest+json;

    # add_header is not inherited into a location that declares its own, so
    # every location below includes the same header set.
    set $csp "__CSP__";

    # Vite output: content-hashed file names, safe to cache forever. ^~ keeps
    # the image/font regex below from taking over hashed assets.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The app shell must always be revalidated so a deploy is picked up at once.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Un-hashed public files (brand, landing, fonts, assessment images): short
    # cache plus ETag revalidation, so a replaced image shows up within an hour.
    location ~* \.(?:png|jpe?g|gif|svg|webp|avif|ico|woff2?|json|txt|xml|webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Client-side routes (/dashboard, /essay-lab/essays/42, ...) get the app
    # shell, which picks the page from the path. No $uri/: a route that shares
    # a name with a public folder would get a 403 instead of the app.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
