# Render Blueprint: the backend's scheduled jobs.
#
# Every job reads the same variables as the web service from the environment
# group `naseeb-backend` (create it first: APP_ENV, SECRET_KEY, DATABASE_URL,
# DIRECT_DATABASE_URL when DATABASE_URL points at PgBouncer, REDIS_URL,
# MEDIA_ROOT, DOCUMENT_STORAGE_ROOT, ...). The web service itself is managed
# in the dashboard; see docs/scaling.md for its pre-deploy command.
#
# Each command takes its own PostgreSQL advisory lock, so an overlapping run
# exits immediately, and deletes in batches of 5,000 rows. Schedules are UTC
# (Tashkent is UTC+5).
services:
  - type: cron
    name: naseeb-flush-expired-tokens
    runtime: python
    plan: starter
    schedule: "30 21 * * *"  # 02:30 Tashkent
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python manage.py flush_expired_tokens
    envVars:
      - fromGroup: naseeb-backend

  - type: cron
    name: naseeb-purge-screen-time
    runtime: python
    plan: starter
    schedule: "0 22 * * *"  # 03:00 Tashkent
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python manage.py purge_screen_time
    envVars:
      - fromGroup: naseeb-backend

  - type: cron
    name: naseeb-generate-notifications
    runtime: python
    plan: starter
    schedule: "0 2 * * *"  # 07:00 Tashkent, before the school day
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python manage.py generate_notifications
    envVars:
      - fromGroup: naseeb-backend

  # Optional: the counselor bot already runs this hourly through /api/bot/meeting-reminders/
  # (see docs/telegram-bot.md). Needs the EMAIL_* variables; with the console backend it sends nothing.
  - type: cron
    name: naseeb-send-meeting-reminders
    runtime: python
    plan: starter
    schedule: "5 * * * *"  # hourly
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python manage.py send_meeting_reminders
    envVars:
      - fromGroup: naseeb-backend

  # Counselor Telegram bot (long polling, no inbound port). It has no database
  # and no passwords: it talks to the backend with BOT_SERVICE_KEY.
  # Setup steps are in docs/telegram-bot.md.
  - type: worker
    name: naseeb-telegram-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r bot/requirements.txt
    startCommand: python -m bot.main
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_SERVICE_KEY
        sync: false
      - key: BACKEND_URL
        value: https://api.naseebedu.com
